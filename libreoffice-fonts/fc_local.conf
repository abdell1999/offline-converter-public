<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/etc/fonts/conf.d/fonts.dtd">
<!--
  Replaces the engine's bundled /instdir/share/fonts/truetype/fc_local.conf,
  which LibreOffice loads when it adds that font folder. The first part is
  the bundled file unchanged; the last alias is ours (Segoe UI -> Selawik).
-->
<fontconfig>
<match target="pattern">
  <test name="family"><string>Symbol</string></test>
  <edit name="family" mode="append" binding="same">
    <string>OpenSymbol</string>
  </edit>
</match>
	<!-- Alias similar/metric-compatible families from various sources: -->

	<alias binding="same">
	  <family>Liberation Sans Narrow</family>
	  <default>
	  <family>Arial Narrow</family>
	  </default>
	</alias>

	<alias binding="same">
	  <family>Arial Narrow</family>
	  <accept>
	  <family>Liberation Sans Narrow</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Calibri</family>
	  <accept>
	  <family>Carlito</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Cambria</family>
	  <accept>
	  <family>Caladea</family>
	  </accept>
	</alias>

	<!-- Microsoft's open Segoe UI metric substitute. -->
	<alias binding="same">
	  <family>Segoe UI</family>
	  <accept>
	  <family>Selawik</family>
	  </accept>
	</alias>
</fontconfig>
